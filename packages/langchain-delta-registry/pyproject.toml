[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "langchain-delta-registry"
version = "1.0.2"
description = "28 pay-per-event regulatory, sanctions, procurement, and corporate-registry monitoring tools for LangChain agents, backed by Apify's hosted MCP gateway."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
authors = [
    { name = "Stefano Seggio", email = "stefanoseggio28@gmail.com" },
]
keywords = [
    "langchain",
    "langchain-tool",
    "regulatory-compliance",
    "sanctions-screening",
    "government-procurement",
    "corporate-registries",
    "apify",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Typing :: Typed",
]
dependencies = [
    "langchain-core>=0.3",
    "pydantic>=2.0",
    "requests>=2.31",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0",
    "pytest-mock>=3.14",
]

[project.urls]
Homepage = "https://delta-registry-website.vercel.app"
Repository = "https://github.com/stefanoseggio/delta-registry-website"
"Actor Store" = "https://apify.com/stefano_seggio"
Issues = "https://github.com/stefanoseggio/delta-registry-website/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/langchain_delta_registry"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
python_version = "3.10"
strict = true
packages = ["langchain_delta_registry"]
