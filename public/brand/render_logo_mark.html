<!DOCTYPE html>
<html><head><style>
html,body{margin:0;padding:0;width:512px;height:512px;overflow:hidden;}
svg{display:block;width:512px;height:512px;}
</style></head>
<body>
<svg viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="bg" cx="32%" cy="26%" r="85%">
      <stop offset="0%" stop-color="#161F38"/>
      <stop offset="55%" stop-color="#0D1326"/>
      <stop offset="100%" stop-color="#080B16"/>
    </radialGradient>
    <linearGradient id="facetLeft" x1="20%" y1="0%" x2="85%" y2="100%">
      <stop offset="0%" stop-color="#5FFBFF"/>
      <stop offset="45%" stop-color="#00D9E8"/>
      <stop offset="100%" stop-color="#0A6E76"/>
    </linearGradient>
    <linearGradient id="facetRight" x1="15%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#0F8A93"/>
      <stop offset="55%" stop-color="#0A4E56"/>
      <stop offset="100%" stop-color="#061C22"/>
    </linearGradient>
    <linearGradient id="edgeHighlight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="rounded">
      <rect width="512" height="512" rx="100"/>
    </clipPath>
  </defs>

  <g clip-path="url(#rounded)">
    <rect width="512" height="512" fill="url(#bg)"/>

    <g stroke="#00F2FE" stroke-width="1" opacity="0.10">
      <line x1="60" y1="90" x2="452" y2="90"/>
      <line x1="60" y1="422" x2="452" y2="422"/>
      <line x1="96" y1="56" x2="256" y2="456"/>
      <line x1="416" y1="56" x2="256" y2="456"/>
      <line x1="60" y1="256" x2="452" y2="256"/>
    </g>
    <g fill="#00F2FE" opacity="0.35">
      <circle cx="96" cy="56" r="2.5"/>
      <circle cx="416" cy="56" r="2.5"/>
      <circle cx="60" cy="256" r="2.5"/>
      <circle cx="452" cy="256" r="2.5"/>
      <circle cx="256" cy="456" r="2.5"/>
    </g>

    <polygon points="256,118 172,384 256,384" fill="url(#facetLeft)"/>
    <polygon points="256,118 256,384 340,384" fill="url(#facetRight)"/>

    <line x1="256" y1="118" x2="256" y2="384" stroke="#080B16" stroke-width="3"/>

    <polygon points="256,206 213,346 299,346" fill="#080B16" opacity="0.9"/>
    <polygon points="256,206 213,346 299,346" fill="none" stroke="#00F2FE" stroke-width="1.5" opacity="0.45"/>

    <polygon points="256,118 172,384 186,384 256,152" fill="url(#edgeHighlight)" opacity="0.5"/>

    <rect x="10" y="10" width="492" height="492" rx="92" fill="none" stroke="#1E2A44" stroke-width="1.5"/>
    <rect x="10" y="10" width="492" height="492" rx="92" fill="none" stroke="#00F2FE" stroke-width="1" opacity="0.18"/>
  </g>
</svg>
</body></html>
