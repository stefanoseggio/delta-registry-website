name: Fleet Silent-Failure Health Check

on:
  schedule:
    - cron: '0 */6 * * *'   # every 6 hours
  workflow_dispatch: {}

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check every actor's real notice + 30-day failure ratio
        run: |
          FLEET="global-regtech-compliance-feed latam-global-tender-intelligence global-corporate-patent-intelligence
          cordoba-compras-monitor entrerios-compras-monitor mendoza-compras-monitor salta-compras-monitor
          santafe-compras-monitor tucuman-compras-monitor pba-tenders-monitor"

          ISSUES_FOUND=0
          echo "## Fleet health check — $(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Actor | Notice | 30d failures |" >> "$GITHUB_STEP_SUMMARY"
          echo "|---|---|---|" >> "$GITHUB_STEP_SUMMARY"

          for actor in $FLEET; do
            RESP=$(curl -s --max-time 20 "https://api.apify.com/v2/acts/stefano_seggio~$actor")
            NOTICE=$(echo "$RESP" | jq -r '.data.notice // "NONE"')
            FAILED=$(echo "$RESP" | jq -r '.data.stats.publicActorRunStats30Days.FAILED // 0')
            TOTAL=$(echo "$RESP" | jq -r '.data.stats.publicActorRunStats30Days.TOTAL // 0')

            echo "| $actor | $NOTICE | $FAILED/$TOTAL |" >> "$GITHUB_STEP_SUMMARY"

            if [ "$NOTICE" != "NONE" ] && [ "$NOTICE" != "null" ]; then
              echo "::warning title=Fleet health::$actor has notice=$NOTICE"
              ISSUES_FOUND=1
            fi
            # A high failure ratio with notice=NONE is the "not yet flagged but clearly
            # unhealthy" case this check exists for - Apify's own flag can lag real signal
            # by days, as directly observed on uk-hse-enforcement-monitor this session.
            if [ "$TOTAL" -gt 0 ] && [ "$FAILED" -gt 0 ]; then
              RATIO=$(( FAILED * 100 / TOTAL ))
              if [ "$RATIO" -ge 50 ]; then
                echo "::warning title=Fleet health::$actor has a $RATIO% failure rate over the last 30 days ($FAILED/$TOTAL) but is not yet flagged Under maintenance"
                ISSUES_FOUND=1
              fi
            fi
          done

          # Non-blocking by design: this is a monitoring signal for the workflow run summary
          # and warning annotations, not a merge gate - there is nothing to "fail" against,
          # it's a scheduled report. Exit 0 always; read the summary/annotations for findings.
          if [ "$ISSUES_FOUND" -eq 1 ]; then
            echo "Issues found - see warnings above and the step summary."
          else
            echo "All actors: notice=NONE, no actor at or above 50% 30-day failure rate."
          fi
