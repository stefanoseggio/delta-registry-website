name: Fleet Health Dashboard

on:
  schedule:
    - cron: '17 */6 * * *'   # every 6 hours (was hourly)
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: fleet-dashboard
  cancel-in-progress: false

jobs:
  build-dashboard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Generate the dashboard from real, live Apify + GitHub API state
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p public
          python3 scripts/generate_dashboard.py > public/fleet-status.html

      - name: Commit if the rendered page actually changed
        run: |
          git config user.name "fleet-dashboard-bot"
          git config user.email "actions@github.com"
          git add public/fleet-status.html
          git diff --cached --quiet || git commit -m "chore: update fleet status dashboard [skip ci]"
          git push
